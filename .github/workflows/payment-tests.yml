name: Payment & Settlement Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**/payment*'
      - 'src/**/campaign-settlement*'
      - 'src/**/setup-fee*'
      - 'src/**/webhooks/**'
      - 'src/**/incident*'
      - 'supabase/migrations/**'
      - '.github/workflows/payment-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**/payment*'
      - 'src/**/campaign-settlement*'
      - 'src/**/setup-fee*'
      - 'src/**/webhooks/**'
      - 'src/**/incident*'
      - 'supabase/migrations/**'
      - '.github/workflows/payment-tests.yml'

jobs:
  test-payments:
    name: Run Payment & Webhook Suite
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL:               ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY:          ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET:      ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
      TEST_WEBHOOK_URL:           ${{ secrets.STAGING_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Barème CGV/CGU + sécurité — pas de réseau requis
      - name: Run unit & security tests
        run: npm test

      # Idempotence setup_fee_charged / travel_supplement / incident_payment_blocked
      - name: Run payment & settlement integration tests
        run: npm run test:payments
        env:
          SUPABASE_URL:              ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Simulation webhook Stripe — skippé si STRIPE_TEST_SECRET_KEY absent
      - name: Run webhook simulation tests
        run: npm run test:webhooks
        env:
          STRIPE_SECRET_KEY:     ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          TEST_WEBHOOK_URL:      ${{ secrets.STAGING_WEBHOOK_URL }}
          SUPABASE_URL:          ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
