name: Publish movespot-mcp to npm

on:
  push:
    tags:
      - "mcp/v*"       # déclenché par un tag git du type mcp/v1.0.1
  workflow_dispatch:   # ou manuellement depuis GitHub Actions

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/movespot-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
